<!doctype html>
<!--
  The link card, at 1200x630.

  Not a screenshot: the terminal is a tall phone screen and a landscape crop
  of it is mostly empty deck. This is built for the shape a chat bubble
  gives it, out of the same palette, the same Courier and the same four
  temper colours the game is made of — a field of dim numbers with four
  clusters agitated in it, one of them boxed, which is the whole game in one
  picture.

  Rendered to public/og.png by tools/og.mjs.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --phos-950: #010604;
        --phos-900: #041a10;
        --phos-700: #0a4a2c;
        --phos-600: #0f7045;
        --phos-500: #17a866;
        --phos-400: #2fd68a;
        --phos-300: #7bf3bb;
        --phos-200: #c3fddf;
        --woe: #4a8cd6;
        --frolic: #f0c548;
        --dread: #9b6cf0;
        --malice: #ff5a4d;
        --mono: "Courier New", "Liberation Mono", "Courier", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: var(--phos-950);
        font-family: var(--mono);
        position: relative;
      }

      /* The number field. Dim, evenly spaced, and behind everything — the
         texture the whole game is played on. */
      #field {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(34, 1fr);
        grid-template-rows: repeat(17, 1fr);
        place-items: center;
        font-size: 21px;
        font-weight: 700;
        color: var(--phos-600);
        opacity: 0.72;
      }
      /* A cluster that has been probed and is agitated: its temper's colour,
         at full strength, lifted off the grid. */
      .lit {
        opacity: 1;
        font-size: 25px;
        transform: scale(1.06);
      }
      .wo { color: var(--woe); text-shadow: 0 0 4px var(--woe), 0 0 16px var(--woe); }
      .fc { color: var(--frolic); text-shadow: 0 0 4px var(--frolic), 0 0 16px var(--frolic); }
      .dr { color: var(--dread); text-shadow: 0 0 4px var(--dread), 0 0 16px var(--dread); }
      .ma { color: var(--malice); text-shadow: 0 0 4px var(--malice), 0 0 16px var(--malice); }

      /* The marquee: a box drawn round the cluster being taken. */
      #box {
        position: absolute;
        left: 98px; top: 104px; width: 122px; height: 126px;
        border: 1.5px solid var(--phos-300);
        border-radius: 3px;
        box-shadow: 0 0 18px rgba(123, 243, 187, 0.35), inset 0 0 22px rgba(123, 243, 187, 0.08);
      }
      #box::after {
        content: "05";
        position: absolute;
        top: -23px; left: 3px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.2em;
        color: var(--phos-300);
        text-shadow: 0 0 10px rgba(123, 243, 187, 0.7);
      }

      /* A scrim under the title, so the type never fights the field. */
      #scrim {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(70% 66% at 50% 49%, rgba(1, 6, 4, 0.99) 0%, rgba(1, 6, 4, 0.975) 52%, rgba(1, 6, 4, 0.8) 78%, rgba(1, 6, 4, 0) 100%);
      }

      #plate {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-top: 18px;
        text-align: center;
      }
      /* Wide, because the mark is wide. It is the thing a glance is meant
         to land on, so it gets nearly half the card. */
      #mark {
        width: 560px;
        filter: drop-shadow(0 0 26px rgba(47, 214, 138, 0.6));
      }
      .rule {
        margin-top: 26px;
        width: 320px;
        height: 1px;
        background: var(--phos-600);
      }
      h1 {
        margin-top: 26px;
        font-size: 43px;
        font-weight: 700;
        line-height: 1.04;
        letter-spacing: 0.16em;
        text-indent: 0.16em;
        color: var(--phos-300);
        text-shadow: 0 0 18px rgba(47, 214, 138, 0.4);
      }
      .tag {
        margin-top: 20px;
        font-size: 21px;
        letter-spacing: 0.035em;
        color: var(--phos-400);
      }

      /* The terminal's own furniture, along the top. Quiet enough that it
         reads as a frame rather than as a second headline. */
      #strip {
        position: absolute;
        left: 46px; right: 46px; top: 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.22em;
        color: var(--phos-600);
      }
      #meter { display: flex; align-items: center; gap: 13px; }
      #meterTrack {
        width: 168px; height: 5px;
        border-radius: 2px;
        background: rgba(6, 48, 29, 0.9);
        overflow: hidden;
      }
      #meterFill {
        width: 78%; height: 100%;
        background: var(--phos-400);
        box-shadow: 0 0 9px var(--phos-400);
      }

      /* CRT glass, last and over everything — the same scanlines and
         vignette the terminal itself wears. */
      /* The glass: scanlines crossed with an aperture grille, which is
         what makes the bright parts break into phosphor dots rather than
         just get striped.

         Coarser than a real tube on purpose. A 1px pitch is correct at
         1200px wide and turns to grey mush the moment a chat bubble
         scales the card to a third of that, which is the size it is
         actually looked at. Six pixels here is about two there — still a
         texture rather than a haze. */
      #glass {
        position: absolute;
        inset: 0;
        background-image:
          repeating-linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0) 0px,
            rgba(0, 0, 0, 0) 3px,
            rgba(0, 0, 0, 0.44) 4px,
            rgba(0, 0, 0, 0.44) 6px
          ),
          repeating-linear-gradient(
            to right,
            rgba(0, 0, 0, 0) 0px,
            rgba(0, 0, 0, 0) 3px,
            rgba(0, 0, 0, 0.36) 4px,
            rgba(0, 0, 0, 0.36) 6px
          );
      }
      /* And the triads themselves, tinting each surviving dot. Faint —
         this is the difference between "a screen" and "a novelty filter". */
      #triads {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
        background-image: repeating-linear-gradient(
          to right,
          rgba(255, 40, 40, 0.09) 0px,
          rgba(255, 40, 40, 0.09) 2px,
          rgba(40, 255, 120, 0.09) 2px,
          rgba(40, 255, 120, 0.09) 4px,
          rgba(60, 110, 255, 0.09) 4px,
          rgba(60, 110, 255, 0.09) 6px
        );
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(104% 88% at 50% 50%, rgba(1, 6, 4, 0) 38%, rgba(1, 6, 4, 0.55) 74%, rgba(1, 6, 4, 0.99) 100%);
      }
    </style>
  </head>
  <body>
    <div id="field"></div>
    <div id="box"></div>
    <div id="scrim"></div>

    <div id="plate">
      <!-- The Lumon mark itself, which is wordmark and emblem in one, so
           the card no longer sets LUMON separately underneath it. -->
      <img id="mark" src="../public/lumon.svg" alt="" />
      <div class="rule"></div>
      <h1>MACRODATA REFINEMENT</h1>
      <div class="tag">Find the numbers that feel wrong.</div>
    </div>

    <div id="strip">
      <div>LUMON OS &nbsp;·&nbsp; FILE: COLD HARBOR</div>
      <div id="meter">
        <div id="meterTrack"><div id="meterFill"></div></div>
        <span>78%</span>
      </div>
    </div>

    <div id="glass"></div>
    <div id="triads"></div>
    <div id="vignette"></div>

    <script>
      // A fixed field rather than a random one: the card is committed to the
      // repository, so it must come out the same every time it is rebuilt.
      const COLS = 34, ROWS = 17;
      const rand = (() => {
        let s = 0x9e3779b1;
        return () => {
          s ^= s << 13; s >>>= 0;
          s ^= s >> 17;
          s ^= s << 5; s >>>= 0;
          return s / 4294967296;
        };
      })();

      // Four clusters, one per temper, placed where they sit clear of the
      // title plate: two out to the left, two out to the right.
      const CLUSTERS = [
        { t: "wo", cells: [[3,3],[4,3],[5,3],[3,4],[4,4],[5,4],[4,5]] },
        { t: "dr", cells: [[2,13],[3,13],[4,13],[2,14],[3,14],[3,12]] },
        { t: "fc", cells: [[29,3],[30,3],[31,3],[30,4],[31,4],[29,4]] },
        { t: "ma", cells: [[28,13],[29,13],[30,13],[29,14],[30,14],[29,12]] },
      ];
      const temper = new Map();
      for (const c of CLUSTERS) for (const [x, y] of c.cells) temper.set(`${x},${y}`, c.t);

      const field = document.getElementById("field");
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const el = document.createElement("span");
          el.textContent = String(Math.floor(rand() * 10));
          const t = temper.get(`${x},${y}`);
          if (t) el.className = `lit ${t}`;
          field.appendChild(el);
        }
      }
    </script>
  </body>
</html>
