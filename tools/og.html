<!doctype html>
<!--
  The link card, at 1200x630.

  Not a screenshot: the terminal is a tall phone screen and a landscape crop
  of it is mostly empty deck. This is built for the shape a chat bubble
  gives it, out of the same palette, the same Courier and the same four
  temper colours the game is made of — a field of dim numbers with four
  clusters agitated in it, one of them boxed, which is the whole game in one
  picture.

  Rendered to public/og.png by tools/og.mjs.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --phos-950: #010604;
        --phos-900: #041a10;
        --phos-700: #0a4a2c;
        --phos-600: #0f7045;
        --phos-500: #17a866;
        --phos-400: #2fd68a;
        --phos-300: #7bf3bb;
        --phos-200: #c3fddf;
        --woe: #4a8cd6;
        --frolic: #f0c548;
        --dread: #9b6cf0;
        --malice: #ff5a4d;
        --mono: "Courier New", "Liberation Mono", "Courier", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: var(--phos-950);
        font-family: var(--mono);
        position: relative;
      }

      /* The number field. Dim, evenly spaced, and behind everything — the
         texture the whole game is played on. */
      #field {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(34, 1fr);
        grid-template-rows: repeat(17, 1fr);
        place-items: center;
        font-size: 21px;
        font-weight: 700;
        color: var(--phos-700);
        opacity: 0.62;
      }
      /* A cluster that has been probed and is agitated: its temper's colour,
         at full strength, lifted off the grid. */
      .lit {
        opacity: 1;
        font-size: 25px;
        transform: scale(1.06);
      }
      .wo { color: var(--woe); text-shadow: 0 0 4px var(--woe), 0 0 16px var(--woe); }
      .fc { color: var(--frolic); text-shadow: 0 0 4px var(--frolic), 0 0 16px var(--frolic); }
      .dr { color: var(--dread); text-shadow: 0 0 4px var(--dread), 0 0 16px var(--dread); }
      .ma { color: var(--malice); text-shadow: 0 0 4px var(--malice), 0 0 16px var(--malice); }

      /* The marquee: a box drawn round the cluster being taken. */
      #box {
        position: absolute;
        left: 98px; top: 104px; width: 122px; height: 126px;
        border: 1.5px solid var(--phos-300);
        border-radius: 3px;
        box-shadow: 0 0 18px rgba(123, 243, 187, 0.35), inset 0 0 22px rgba(123, 243, 187, 0.08);
      }
      #box::after {
        content: "05";
        position: absolute;
        top: -23px; left: 3px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.2em;
        color: var(--phos-300);
        text-shadow: 0 0 10px rgba(123, 243, 187, 0.7);
      }

      /* A scrim under the title, so the type never fights the field. */
      #scrim {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(58% 50% at 50% 44%, rgba(1, 6, 4, 0.985) 0%, rgba(1, 6, 4, 0.95) 42%, rgba(1, 6, 4, 0.72) 72%, rgba(1, 6, 4, 0) 100%);
      }

      #plate {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-bottom: 74px;
        text-align: center;
      }
      .eyebrow {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.52em;
        text-indent: 0.52em;
        color: var(--phos-500);
      }
      h1 {
        margin-top: 21px;
        font-size: 74px;
        font-weight: 700;
        line-height: 1.04;
        letter-spacing: 0.1em;
        text-indent: 0.1em;
        color: var(--phos-200);
        text-shadow: 0 0 2px var(--phos-300), 0 0 26px rgba(47, 214, 138, 0.55);
      }
      .rule {
        margin-top: 26px;
        width: 188px;
        height: 1px;
        background: var(--phos-500);
        opacity: 0.85;
      }
      .tag {
        margin-top: 24px;
        font-size: 22px;
        letter-spacing: 0.035em;
        color: var(--phos-400);
      }

      /* The four bins, along the foot. The clearest possible statement of
         what the game asks you to do. */
      #bins {
        position: absolute;
        left: 0; right: 0; bottom: 40px;
        display: flex;
        justify-content: center;
        gap: 15px;
      }
      .bin {
        width: 176px;
        padding: 11px 0 13px;
        border: 1.5px solid;
        border-radius: 3px;
        background: rgba(4, 26, 16, 0.85);
        box-shadow: 0 0 22px rgba(1, 6, 4, 0.9);
        text-align: center;
      }
      .bin b {
        display: block;
        font-size: 23px;
        letter-spacing: 0.22em;
        text-indent: 0.22em;
      }
      .bin span {
        display: block;
        margin-top: 5px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.3em;
        text-indent: 0.3em;
        color: var(--phos-500);
      }

      /* The terminal's own furniture, along the top. Quiet enough that it
         reads as a frame rather than as a second headline. */
      #strip {
        position: absolute;
        left: 46px; right: 46px; top: 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.22em;
        color: var(--phos-600);
      }
      #meter { display: flex; align-items: center; gap: 13px; }
      #meterTrack {
        width: 168px; height: 5px;
        border-radius: 2px;
        background: rgba(6, 48, 29, 0.9);
        overflow: hidden;
      }
      #meterFill {
        width: 78%; height: 100%;
        background: var(--phos-400);
        box-shadow: 0 0 9px var(--phos-400);
      }

      /* CRT glass, last and over everything — the same scanlines and
         vignette the terminal itself wears. */
      #glass {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 2px,
          rgba(0, 0, 0, 0.26) 3px,
          rgba(0, 0, 0, 0.26) 4px
        );
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(104% 88% at 50% 50%, rgba(1, 6, 4, 0) 38%, rgba(1, 6, 4, 0.55) 74%, rgba(1, 6, 4, 0.99) 100%);
      }
    </style>
  </head>
  <body>
    <div id="field"></div>
    <div id="box"></div>
    <div id="scrim"></div>

    <div id="plate">
      <div class="eyebrow">LUMON INDUSTRIES</div>
      <h1>MACRODATA<br />REFINEMENT</h1>
      <div class="rule"></div>
      <div class="tag">Find the numbers that feel wrong.</div>
    </div>

    <div id="bins">
      <div class="bin" style="border-color: var(--woe)">
        <b style="color: var(--woe)">WO</b><span>WOE</span>
      </div>
      <div class="bin" style="border-color: var(--frolic)">
        <b style="color: var(--frolic)">FC</b><span>FROLIC</span>
      </div>
      <div class="bin" style="border-color: var(--dread)">
        <b style="color: var(--dread)">DR</b><span>DREAD</span>
      </div>
      <div class="bin" style="border-color: var(--malice)">
        <b style="color: var(--malice)">MA</b><span>MALICE</span>
      </div>
    </div>

    <div id="strip">
      <div>LUMON OS &nbsp;·&nbsp; FILE: COLD HARBOR</div>
      <div id="meter">
        <div id="meterTrack"><div id="meterFill"></div></div>
        <span>78%</span>
      </div>
    </div>

    <div id="glass"></div>
    <div id="vignette"></div>

    <script>
      // A fixed field rather than a random one: the card is committed to the
      // repository, so it must come out the same every time it is rebuilt.
      const COLS = 34, ROWS = 17;
      const rand = (() => {
        let s = 0x9e3779b1;
        return () => {
          s ^= s << 13; s >>>= 0;
          s ^= s >> 17;
          s ^= s << 5; s >>>= 0;
          return s / 4294967296;
        };
      })();

      // Four clusters, one per temper, placed where they sit clear of the
      // title plate: two out to the left, two out to the right.
      const CLUSTERS = [
        { t: "wo", cells: [[3,3],[4,3],[5,3],[3,4],[4,4],[5,4],[4,5]] },
        { t: "dr", cells: [[2,12],[3,12],[4,12],[2,13],[3,13],[3,11]] },
        { t: "fc", cells: [[29,3],[30,3],[31,3],[30,4],[31,4],[29,4]] },
        { t: "ma", cells: [[28,12],[29,12],[30,12],[29,13],[30,13],[30,11]] },
      ];
      const temper = new Map();
      for (const c of CLUSTERS) for (const [x, y] of c.cells) temper.set(`${x},${y}`, c.t);

      const field = document.getElementById("field");
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const el = document.createElement("span");
          el.textContent = String(Math.floor(rand() * 10));
          const t = temper.get(`${x},${y}`);
          if (t) el.className = `lit ${t}`;
          field.appendChild(el);
        }
      }
    </script>
  </body>
</html>
