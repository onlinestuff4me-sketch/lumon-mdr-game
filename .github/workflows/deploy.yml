name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Verification on every pull request. PR #2 removed the branch push
  # trigger so a stray push cannot overwrite what main publishes; this puts
  # the checks back without putting the deploy back. The `deploy` job is
  # gated on the event, so a PR builds and tests but never publishes.
  pull_request:
    # Drafts are work in progress by definition. A ten-minute suite on every
    # push to a branch nobody is reviewing yet buys nothing; marking the PR
    # ready for review runs it.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# One group per ref, and — critically — a *different* group for the runs
# that publish.
#
# Both halves of this used to be `pages`, which meant a push to any open
# pull request would cancel a deploy of `main` that was already in flight:
# same group, `cancel-in-progress`, and the PR run wins because it started
# later. The site was then left on whatever the last deploy that survived
# had published, with a green merge commit suggesting otherwise.
#
# Now a PR only ever cancels its own earlier run, and only `main` can
# cancel a deploy — which is the behaviour this was meant to have: a newer
# push supersedes an in-flight publish rather than queueing behind it.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'deploy' }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # The suite is about ten minutes, most of it end-to-end. Twenty-five
    # leaves room for a slow runner and still kills a job that has hung on
    # a `waitForFunction` rather than letting it sit for the six hours
    # GitHub allows by default.
    timeout-minutes: 25
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and lint
        run: |
          npx tsc -b
          npm run lint

      - name: Build
        # Its own origin, so the link card this host serves points at this
        # host rather than at the other one. Open Graph needs an absolute
        # URL and there are two places this is published.
        env:
          SITE_URL: https://onlinestuff4me-sketch.github.io/lumon-mdr-game
        run: npm run build

      # The suite drives the real game through real pointer events against a
      # production build. It is the gate that would have caught the leaked
      # gesture that made the board unplayable, and the skewed marquee that
      # shipped alongside it.
      - name: Install Chromium for the end-to-end suite
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      # Pages must be switched on once by hand (Settings -> Pages -> Source:
      # GitHub Actions). The Actions token is not permitted to create a Pages
      # site — the first run here failed with "Resource not accessible by
      # integration". `enablement` is kept so the call is a no-op once the
      # site exists, and would self-serve if the permission is ever granted.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
