name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Verification on every pull request. PR #2 removed the branch push
  # trigger so a stray push cannot overwrite what main publishes; this puts
  # the checks back without putting the deploy back. The `deploy` job is
  # gated on the event, so a PR builds and tests but never publishes.
  pull_request:
  workflow_dispatch:

# Allow one concurrent deployment; a newer push supersedes an in-flight one
# rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and lint
        run: |
          npx tsc -b
          npm run lint

      - name: Build
        run: npm run build

      # The suite drives the real game through real pointer events against a
      # production build. It is the gate that would have caught the leaked
      # gesture that made the board unplayable, and the skewed marquee that
      # shipped alongside it.
      - name: Install Chromium for the end-to-end suite
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      # Pages must be switched on once by hand (Settings -> Pages -> Source:
      # GitHub Actions). The Actions token is not permitted to create a Pages
      # site — the first run here failed with "Resource not accessible by
      # integration". `enablement` is kept so the call is a no-op once the
      # site exists, and would self-serve if the permission is ever granted.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' 
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
