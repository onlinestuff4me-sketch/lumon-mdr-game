name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/severance-mdr-game-lfvw52
  workflow_dispatch:

# Allow one concurrent deployment; a newer push supersedes an in-flight one
# rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and lint
        run: |
          npx tsc -b
          npm run lint

      - name: Build
        run: npm run build

      # Pages must be switched on once by hand (Settings -> Pages -> Source:
      # GitHub Actions). The Actions token is not permitted to create a Pages
      # site — the first run here failed with "Resource not accessible by
      # integration". `enablement` is kept so the call is a no-op once the
      # site exists, and would self-serve if the permission is ever granted.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
